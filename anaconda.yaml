anaconda_config_version: 1
upstream_sources:
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/libnvfatbin
      regex: '"version":\s*"([^"]+)"'
    packages:
      - libnvfatbin
      - libnvfatbin-dev
      - libnvfatbin-static
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/libnvfatbin
      regex: '"version":\s*"(13\.2(?:\.\d+)*)"'
    feedstock_branch: '13.2'
    version_matchspec: '>=13.2,<13.3'
    supported: true
    packages:
      - libnvfatbin
      - libnvfatbin-dev
      - libnvfatbin-static
